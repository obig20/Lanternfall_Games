name: Deploy
on:
  push:
    branches: [master]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: lanternfall/package-lock.json
      - name: Install
        working-directory: lanternfall
        run: npm ci
      - name: Typecheck
        working-directory: lanternfall
        run: npx tsc --noEmit
      - name: Lint
        working-directory: lanternfall
        run: npx eslint .
      - name: Test
        working-directory: lanternfall
        run: npx vitest run
      - name: Build
        working-directory: lanternfall
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: lanternfall/dist
  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
