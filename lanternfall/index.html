<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lanternfall</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0e0a3a; }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; cursor: grab; }

      .hud-root { position: absolute; inset: 0; pointer-events: none; font-family: system-ui, "Segoe UI", sans-serif; color: #f4efff; }
      .hud-root .hidden { display: none !important; }
      .hud-root button { pointer-events: auto; }

      .screen { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
                background: radial-gradient(ellipse at center, rgba(14,10,58,.35), rgba(14,10,58,.82)); }
      .panel { text-align: center; padding: 28px 40px; max-width: 520px; border-radius: 16px;
               background: rgba(24,16,70,.72); border: 1px solid rgba(255,211,107,.45); backdrop-filter: blur(6px);
               box-shadow: 0 0 60px rgba(255,211,107,.18); }
      h1 { margin: 0 0 4px; font-size: 44px; letter-spacing: .28em; color: #ffd36b; text-shadow: 0 0 24px rgba(255,211,107,.6); }
      h2 { margin: 0 0 8px; font-size: 30px; color: #ffd36b; }
      .tag { margin: 0 0 16px; color: #cfc6ff; font-style: italic; }
      .how { color: #d9d2ff; font-size: 14px; line-height: 1.5; }
      .controls { list-style: none; padding: 0; margin: 0 0 14px; font-size: 14px; line-height: 1.9; }
      .controls b { display: inline-block; min-width: 70px; color: #ffd36b; }
      button { margin-top: 12px; padding: 10px 34px; font-size: 18px; font-weight: 600; letter-spacing: .08em; cursor: pointer;
               color: #1a1040; background: #ffd36b; border: 0; border-radius: 999px; box-shadow: 0 0 22px rgba(255,211,107,.55); }
      button:hover { background: #ffe39a; }

      #hud .objective { position: absolute; top: 16px; left: 16px; padding: 10px 14px; border-radius: 10px; background: rgba(24,16,70,.6); border-left: 3px solid #ffd36b; }
      .objective .label { font-size: 11px; letter-spacing: .2em; color: #ffd36b; }
      .objective .sub { font-size: 12px; color: #cfc6ff; margin-top: 2px; }
      #hud .pulse { position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%); text-align: center; width: 220px; }
      .pulse .bar { height: 8px; border-radius: 4px; background: rgba(255,255,255,.18); overflow: hidden; }
      #pulse-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #ff9a3d, #ffd36b); }
      #pulse-text { margin-top: 6px; font-size: 13px; color: #e8e0ff; text-shadow: 0 1px 4px #000; }
      .pulse-ready #pulse-text { color: #ffd36b; }
      .toast { position: absolute; top: 18%; left: 50%; transform: translateX(-50%); padding: 10px 20px; border-radius: 999px;
               background: rgba(24,16,70,.8); border: 1px solid rgba(255,211,107,.5); opacity: 0; transition: opacity .3s; }
      .toast.show { opacity: 1; }
      .flash { position: absolute; inset: 0; background: #0e0a3a; opacity: 0; transition: opacity .25s; }
      .flash.on { opacity: .85; transition: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
